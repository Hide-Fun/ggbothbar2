on:
  push:
    branches: [main, dev]
  pull_request:

name: R-CMD-check

permissions: read-all

jobs:
  install-without-google:
    runs-on: ubuntu-latest
    name: Install without Google clients

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::openxlsx
          cache-version: no-google-v1

      - name: Assert optional Google clients are absent
        shell: Rscript {0}
        run: |
          stopifnot(!requireNamespace("googlesheets4", quietly = TRUE))
          stopifnot(!requireNamespace("googledrive", quietly = TRUE))

      - name: Install package
        run: R CMD INSTALL .

      - name: Exercise optional-dependency boundary
        shell: Rscript {0}
        run: |
          library(ggbothbar)

          condition <- tryCatch(
            write_sheets(
              list(data.frame(value = 1)),
              sheet_names = "data",
              name = "google-output"
            ),
            error = identity
          )
          stopifnot(inherits(condition, "ggbothbar_missing_dependency"))
          stopifnot(identical(condition$missing_packages, "googlesheets4"))

          path <- tempfile(fileext = ".xlsx")
          result <- write_sheets(
            list(data.frame(value = 1)),
            sheet_names = "data",
            name = "local-output",
            local = TRUE,
            path = path
          )
          stopifnot(file.exists(result$file_path[[1]]))
          unlink(path)

          removed <- c(
            "Geomerrorbarb",
            "errorbarbGrob",
            "create_errorbarb",
            "makeContent.errorbarb"
          )
          stopifnot(!any(removed %in% getNamespaceExports("ggbothbar")))

          plot <- ggplot(mtcars, aes(wt, mpg)) + geom_errorbarb()
          stopifnot(inherits(ggplotGrob(plot), "gtable"))

  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-22.04, r: '4.1'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          - {os: macos-latest, r: 'release'}
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
